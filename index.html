<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шахматы</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game">
    <header class="game-header">
      <div>
        <h1>Шахматы</h1>
        <p id="status" class="status" aria-live="polite">Ход белых</p>
      </div>
      <button id="restart" class="restart-button" type="button">Новая игра</button>
    </header>

    <div
      id="board"
      class="board"
      role="grid"
      aria-label="Шахматная доска"
    ></div>

    <p class="hint">Выберите фигуру, затем клетку для хода.</p>
  </main>
</body>
</html>
